name: caloriq
description: AI-powered calorie tracker for weight loss and weight gain.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local SQLite Database
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Firebase
  firebase_core: ^3.10.0
  cloud_functions: ^5.2.0

  # Health & Sensors
  health: ^13.3.2

  # Background Sync
  workmanager: ^0.5.2

  # Camera & Media
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.70.2

  # Calendar
  table_calendar: ^3.1.3

  # CSV Export & Sharing
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
